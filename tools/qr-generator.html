<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - QuickTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold hover:underline">&larr; Back to Home</a>
            <span class="font-bold text-gray-900">QuickTools</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 text-center">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">QR Code Generator</h1>
            <p class="text-gray-600 text-sm mb-6">Generate instant downloadable QR codes for text or URLs.</p>

            <input type="text" id="qrText" placeholder="Enter URL or Text (e.g., https://example.com)" class="w-full p-3 border border-gray-300 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <button id="generateBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-all">Generate QR Code</button>

            <div id="qrResult" class="mt-6 hidden">
                <img id="qrImage" class="mx-auto rounded-lg border p-2 shadow-sm mb-4" alt="Generated QR Code">
                <a id="downloadQr" download="qrcode.png" target="_blank" class="inline-block bg-gray-900 text-white text-sm font-semibold px-6 py-2 rounded-lg">Download QR Image</a>
            </div>
        </div>
    </main>

    <script>
        const qrText = document.getElementById('qrText');
        const generateBtn = document.getElementById('generateBtn');
        const qrResult = document.getElementById('qrResult');
        const qrImage = document.getElementById('qrImage');
        const downloadQr = document.getElementById('downloadQr');

        generateBtn.addEventListener('click', () => {
            const val = qrText.value.trim();
            if (!val) return;
            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(val)}`;
            qrImage.src = apiUrl;
            downloadQr.href = apiUrl;
            qrResult.classList.remove('hidden');
        });
    </script>
</body>
</html>

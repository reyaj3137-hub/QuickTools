<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PNG Converter - QuickTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold hover:underline">&larr; Back to Home</a>
            <span class="font-bold text-gray-900">QuickTools</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200 text-center">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">JPG to PNG Converter</h1>
            <p class="text-gray-600 text-sm mb-6">Convert your JPG images to true PNG format locally in your browser.</p>

            <input type="file" id="imageInput" accept="image/jpeg, image/jpg" class="mb-6 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">

            <div id="resultArea" class="hidden space-y-6">
                <canvas id="canvas" class="hidden"></canvas>
                <div class="border rounded-lg p-2 bg-gray-50 inline-block">
                    <img id="preview" class="max-h-64 mx-auto rounded shadow-sm" alt="Converted PNG Preview">
                </div>
                <div>
                    <a id="downloadBtn" class="bg-indigo-600 text-white font-bold px-8 py-3 rounded-xl shadow hover:bg-indigo-700 transition-all inline-block cursor-pointer">
                        Download PNG Image
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const imageInput = document.getElementById('imageInput');
        const resultArea = document.getElementById('resultArea');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const downloadBtn = document.getElementById('downloadBtn');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    // Convert Canvas context to PNG Blob to ensure real binary conversion
                    canvas.toBlob((blob) => {
                        const pngUrl = URL.createObjectURL(blob);
                        preview.src = pngUrl;
                        downloadBtn.href = pngUrl;
                        downloadBtn.download = file.name.replace(/\.[^/.]+$/, "") + ".png";
                        resultArea.classList.remove('hidden');
                    }, 'image/png');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>

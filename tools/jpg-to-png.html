<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PNG Converter - QuickTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200 p-4">
        <a href="../index.html" class="text-indigo-600 font-bold">&larr; হোমপেজে ফিরে যান</a>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center">
            <h1 class="text-2xl font-extrabold mb-4">JPG to PNG Converter</h1>
            <input type="file" id="imageInput" accept="image/jpeg, image/jpg" class="mb-4">
            <div id="resultArea" class="hidden space-y-4">
                <canvas id="canvas" class="hidden"></canvas>
                <img id="convertedPreview" class="max-h-48 mx-auto rounded border" alt="Converted PNG">
                <br>
                <a id="downloadBtn" download="converted.png" class="inline-block bg-indigo-600 text-white font-bold px-6 py-2 rounded-lg">PNG ডাউনলোড করুন</a>
            </div>
        </div>
    </main>

    <script>
        const imageInput = document.getElementById('imageInput');
        const resultArea = document.getElementById('resultArea');
        const convertedPreview = document.getElementById('convertedPreview');
        const canvas = document.getElementById('canvas');
        const downloadBtn = document.getElementById('downloadBtn');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const pngUrl = canvas.toDataURL('image/png');
                    convertedPreview.src = pngUrl;
                    downloadBtn.href = pngUrl;
                    resultArea.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>

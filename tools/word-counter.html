<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word & Character Counter - QuickTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm border-b border-gray-200 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-indigo-600 font-bold hover:underline">&larr; Back to Home</a>
            <span class="font-bold text-gray-900">QuickTools</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2 text-center">Word & Character Counter</h1>
            <p class="text-gray-600 text-sm mb-6 text-center">Real-time counter for words, characters, sentences, and paragraphs.</p>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 text-center">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100"><p class="text-2xl font-bold text-indigo-600" id="wordCount">0</p><p class="text-xs text-gray-600">Words</p></div>
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100"><p class="text-2xl font-bold text-indigo-600" id="charCount">0</p><p class="text-xs text-gray-600">Characters</p></div>
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100"><p class="text-2xl font-bold text-indigo-600" id="sentenceCount">0</p><p class="text-xs text-gray-600">Sentences</p></div>
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100"><p class="text-2xl font-bold text-indigo-600" id="readingTime">0 min</p><p class="text-xs text-gray-600">Reading Time</p></div>
            </div>

            <textarea id="textInput" rows="8" placeholder="Type or paste your text here..." class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
        </div>
    </main>

    <script>
        const textInput = document.getElementById('textInput');
        textInput.addEventListener('input', () => {
            const text = textInput.value.trim();
            const words = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
            const chars = textInput.value.length;
            const sentences = text ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;
            const minutes = Math.ceil(words / 200);

            document.getElementById('wordCount').innerText = words;
            document.getElementById('charCount').innerText = chars;
            document.getElementById('sentenceCount').innerText = sentences;
            document.getElementById('readingTime').innerText = minutes + " min";
        });
    </script>
</body>
</html>
